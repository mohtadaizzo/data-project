name: Eurogate CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Check backend
        working-directory: backend
        run: npm test --if-present

      - name: Build backend Docker image
        run: docker build -t eurogate-backend:latest ./backend

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AI dependencies
        run: pip install -r ai/requirements.txt

      - name: Check Python syntax
        run: python -m compileall ai

      - name: Build AI Docker image
        run: docker build -t eurogate-ai:latest ./ai

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build frontend Docker image
        run: docker build -t eurogate-frontend:latest ./frontend

  push-images:
    needs: [backend, ai, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eurogate-backend:latest

      - name: Build and push AI
        uses: docker/build-push-action@v6
        with:
          context: ./ai
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eurogate-ai:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eurogate-frontend:latest